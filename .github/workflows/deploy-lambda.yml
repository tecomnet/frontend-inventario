# Actualiza la función Lambda del BFF en cada push que toque server/.
# El front (dist/) lo redepliega Amplify por su cuenta; esto es solo el BFF.
name: Deploy BFF Lambda

on:
  push:
    branches: [main, master]
    paths:
      - 'server/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-lambda.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # npm ci a secas: antes tenia "|| npm install", que convertia un lockfile
      # roto en una instalacion distinta a la esperada y aun asi publicaba.
      - name: Install deps
        run: npm ci --no-audit --no-fund

      # La verificacion vive AQUI y no en un "needs:" del CI: needs solo enlaza
      # jobs del mismo workflow, y el job que verifica (ci.yml) es otro archivo.
      # Con estos tres pasos, si algo falla el job se detiene y la Lambda no se
      # actualiza, que es lo que pide el criterio de KL-65.
      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npx tsc -b

      - name: Pruebas
        run: npx vitest run

      - name: Build Lambda bundle
        run: npm run build:lambda

      - name: Zip bundle
        run: |
          cd lambda
          zip -r ../lambda.zip index.cjs
          cd ..

      - name: Update Lambda function code
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws lambda update-function-code \
            --function-name "${{ secrets.LAMBDA_FUNCTION_NAME }}" \
            --zip-file fileb://lambda.zip \
            --publish
